<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=440">
  <title>GemLog Next</title>
  <style>
    /* ===== Crystalline Dark Theme ===== */
    :root {
      --bg:           #080c14;
      --bg-card:      rgba(255,255,255,0.04);
      --bg-card-hover:rgba(255,255,255,0.07);
      --bg-input:     rgba(255,255,255,0.06);
      --accent:       #10b981;
      --accent-dim:   #059669;
      --accent-glow:  rgba(16,185,129,0.18);
      --accent-border:rgba(16,185,129,0.28);
      --text:         #e2e8f0;
      --text-dim:     #64748b;
      --text-dimmer:  #2d3a4a;
      --border:       rgba(255,255,255,0.08);
      --danger:       #ef4444;
      --danger-bg:    rgba(239,68,68,0.12);
      --warning:      #f59e0b;
      --mono:         'SF Mono','Fira Code','Cascadia Code','Consolas',monospace;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      width: 440px;
      height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 20px; right: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.35;
    }

    .logo { display: flex; align-items: center; gap: 8px; }

    .logo-icon {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      box-shadow: 0 0 14px rgba(16,185,129,0.35);
    }

    .logo-name {
      font-size: 15px; font-weight: 700; letter-spacing: -0.3px;
      background: linear-gradient(135deg, #e2e8f0, #94a3b8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-badge {
      font-size: 9px; font-family: var(--mono);
      color: var(--accent);
      padding: 1px 5px;
      border: 1px solid var(--accent-border);
      border-radius: 4px;
      letter-spacing: 0.4px;
    }

    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-dimmer);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.active { background: var(--accent); box-shadow: 0 0 7px var(--accent); }

    .header-actions { display: flex; align-items: center; gap: 4px; }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 12px;
      flex-shrink: 0;
    }

    .tab {
      padding: 9px 14px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 12px; font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ===== PANEL SYSTEM ===== */
    .panel-container {
      flex: 1; overflow: hidden;
      position: relative;
    }

    .panel {
      position: absolute; inset: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .panel.active { display: flex; }

    /* ===== SEARCH BAR ===== */
    .search-bar {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: none;
      animation: slideDown 0.18s ease;
    }
    .search-bar.visible { display: block; }

    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-prefix {
      position: absolute; left: 10px;
      color: var(--text-dim); font-size: 13px; pointer-events: none;
    }
    .search-input {
      width: 100%; padding: 7px 10px 7px 30px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text); font-size: 12px; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search-input::placeholder { color: var(--text-dim); }

    /* ===== LIST CONTROLS ===== */
    .list-controls {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ctrl-label { font-size: 11px; color: var(--text-dim); }
    .ctrl-select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px; color: var(--text);
      font-size: 11px; padding: 3px 7px;
      outline: none; cursor: pointer;
      transition: border-color 0.15s;
    }
    .ctrl-select:focus { border-color: var(--accent); }
    .spacer { flex: 1; }
    .count-badge {
      font-size: 10px; font-family: var(--mono);
      color: var(--text-dim);
      padding: 2px 7px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    /* ===== CURRENT CHAT BAR ===== */
    .current-chat-bar {
      margin: 9px 14px 0;
      padding: 10px 12px;
      background: rgba(16,185,129,0.05);
      border: 1px solid rgba(16,185,129,0.18);
      border-radius: 10px;
      display: none; flex-shrink: 0;
    }
    .current-chat-bar.visible { display: block; }

    .ccb-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 7px;
    }
    .ccb-label {
      font-size: 10px; font-family: var(--mono);
      color: var(--accent); letter-spacing: 0.5px; text-transform: uppercase;
    }

    .logging-badge {
      font-size: 9px; font-weight: 600; letter-spacing: 0.3px;
      padding: 2px 8px; border-radius: 10px;
    }
    .logging-badge.recording {
      background: rgba(16,185,129,0.18);
      color: var(--accent);
      border: 1px solid rgba(16,185,129,0.3);
    }
    .logging-badge.stopped {
      background: var(--bg-input);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }
    .ccb-actions { display: flex; gap: 6px; }

    /* ===== CHAT LIST ===== */
    .chat-list {
      display: flex; flex-direction: column; gap: 6px;
      padding: 10px 14px;
      flex: 1; overflow-y: auto;
    }

    .chat-item {
      padding: 11px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.16s, border-color 0.16s, transform 0.16s, box-shadow 0.16s;
      animation: fadeSlideIn 0.25s ease both;
    }
    .chat-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255,255,255,0.13);
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.28);
    }
    .chat-item.favorited { border-color: rgba(16,185,129,0.22); }

    .chat-item-header {
      display: flex; align-items: flex-start; gap: 7px; margin-bottom: 4px;
    }
    .fav-btn {
      background: none; border: none; padding: 0;
      cursor: pointer; font-size: 13px; color: var(--text-dimmer);
      transition: color 0.15s, transform 0.15s; flex-shrink: 0; line-height: 1.5;
    }
    .fav-btn:hover { color: var(--warning); transform: scale(1.2); }
    .fav-btn.active { color: var(--warning); }

    .chat-title {
      font-weight: 600; font-size: 13px;
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .chat-meta {
      display: flex; gap: 6px; align-items: center;
      font-size: 10px; color: var(--text-dim); font-family: var(--mono);
    }

    .chat-tags {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;
    }
    .tag {
      font-size: 9px; padding: 2px 7px; border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-dim); cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .tag:hover {
      background: var(--accent-glow);
      border-color: var(--accent-border);
      color: var(--accent);
    }

    .chat-actions {
      display: flex; gap: 4px; margin-top: 8px;
    }

    /* ===== BUTTONS ===== */
    .btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg-input);
      color: var(--text); cursor: pointer;
      font-size: 11px; font-family: inherit;
      transition: background 0.14s, border-color 0.14s;
      white-space: nowrap;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn:hover { background: var(--bg-card-hover); border-color: rgba(255,255,255,0.14); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
    .btn.primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
    .btn.danger { border-color: rgba(239,68,68,0.3); color: var(--danger); }
    .btn.danger:hover { background: var(--danger-bg); border-color: var(--danger); }
    .btn.sm { padding: 4px 9px; font-size: 10px; border-radius: 6px; }
    .btn.xs { padding: 2px 7px; font-size: 10px; border-radius: 5px; }

    .icon-btn {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-input);
      color: var(--text-dim); cursor: pointer; font-size: 14px;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .icon-btn:hover { background: var(--bg-card-hover); color: var(--text); border-color: rgba(255,255,255,0.14); }
    .icon-btn.active { border-color: var(--accent-border); color: var(--accent); background: var(--accent-glow); }

    /* ===== DETAIL PANEL ===== */
    .detail-header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px 0; flex-shrink: 0;
    }
    .detail-title {
      font-size: 14px; font-weight: 700; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .fav-btn-large {
      background: none; border: none; padding: 0;
      cursor: pointer; font-size: 18px; color: var(--text-dimmer);
      transition: color 0.15s, transform 0.15s; flex-shrink: 0;
    }
    .fav-btn-large:hover { color: var(--warning); transform: scale(1.15); }
    .fav-btn-large.active { color: var(--warning); }

    .detail-actions {
      display: flex; gap: 5px; flex-wrap: wrap;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .message-list { flex: 1; overflow-y: auto; padding: 10px 14px; }

    .msg {
      margin-bottom: 8px; padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.15s;
    }
    .msg:hover { border-color: rgba(255,255,255,0.11); }

    .msg-role {
      font-size: 10px; font-family: var(--mono); font-weight: 600;
      color: var(--accent); margin-bottom: 5px;
      display: flex; align-items: center; gap: 5px; letter-spacing: 0.3px;
    }
    .msg-role.model { color: var(--warning); }

    .msg-content {
      font-size: 12px; color: var(--text-dim);
      line-height: 1.6; white-space: pre-wrap; word-break: break-word;
      max-height: 90px; overflow: hidden;
    }
    .msg-code-badge {
      margin-top: 5px; font-size: 10px; color: var(--accent); font-family: var(--mono);
    }

    /* ===== SUMMARY CARD ===== */
    .summary-card {
      margin: 0 14px 8px; padding: 12px;
      background: rgba(16,185,129,0.05);
      border: 1px solid rgba(16,185,129,0.2);
      border-radius: 10px;
      flex-shrink: 0; display: none;
    }
    .summary-card.visible { display: block; }

    .summary-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px;
    }
    .summary-label {
      font-size: 10px; font-family: var(--mono);
      color: var(--accent); letter-spacing: 0.3px; text-transform: uppercase;
    }
    .summary-text {
      font-size: 12px; color: var(--text-dim); line-height: 1.7; white-space: pre-wrap;
    }

    /* ===== SETTINGS ===== */
    .settings-body {
      flex: 1; overflow-y: auto;
      padding: 14px;
      display: flex; flex-direction: column; gap: 18px;
    }

    .s-section { display: flex; flex-direction: column; gap: 10px; }

    .s-section-title {
      font-size: 10px; font-family: var(--mono);
      color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }

    .form-label {
      font-size: 11px; font-weight: 500; color: var(--text-dim);
    }

    .form-input {
      width: 100%; padding: 8px 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-size: 12px; outline: none; font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .form-input.mono { font-family: var(--mono); font-size: 11px; }
    .form-input.error { border-color: var(--danger); }

    .form-hint { font-size: 10px; color: var(--text-dim); line-height: 1.4; }

    .form-error { font-size: 10px; color: var(--danger); display: none; }
    .form-error.visible { display: block; }

    /* パスワード表示切替 */
    .pw-wrap { position: relative; }
    .pw-wrap .form-input { padding-right: 36px; }
    .pw-toggle {
      position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-dim); font-size: 14px; padding: 0;
      transition: color 0.15s;
    }
    .pw-toggle:hover { color: var(--text); }

    /* URL ステータス */
    .url-status { display: flex; align-items: center; gap: 4px; font-size: 10px; margin-top: 3px; }
    .url-status.valid   { color: var(--accent); }
    .url-status.invalid { color: var(--danger); }

    /* API Fieldsラッパー */
    #apiFields { display: flex; flex-direction: column; gap: 10px; }

    /* ===== STORAGE FOOTER ===== */
    .storage-footer {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .storage-info {
      display: flex; justify-content: space-between;
      font-size: 10px; font-family: var(--mono); color: var(--text-dim);
      margin-bottom: 4px;
    }
    .storage-track {
      height: 3px; background: var(--border);
      border-radius: 2px; overflow: hidden;
    }
    .storage-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #06b6d4);
      border-radius: 2px; transition: width 0.4s ease;
    }

    /* ===== MANAGED LIST ===== */
    .managed-list {
      max-height: 120px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg-input);
    }
    .managed-list-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    .managed-list-item:last-child { border-bottom: none; }
    .managed-list-title {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      margin-right: 8px; color: var(--text);
    }
    .managed-list-empty {
      padding: 16px; text-align: center;
      color: var(--text-dim); font-size: 11px;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 20px; color: var(--text-dim); text-align: center; gap: 8px;
    }
    .empty-icon { font-size: 38px; opacity: 0.45; animation: float 3s ease-in-out infinite; }
    .empty-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .empty-sub { font-size: 11px; max-width: 230px; line-height: 1.5; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 44px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      padding: 8px 16px;
      background: rgba(15,23,42,0.96);
      border: 1px solid var(--accent-border);
      border-radius: 8px; font-size: 12px; color: var(--text);
      transition: transform 0.22s ease, opacity 0.22s ease;
      opacity: 0; z-index: 1000;
      backdrop-filter: blur(10px);
      white-space: nowrap; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeSlideIn {
      from { opacity:0; transform:translateY(7px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes slideDown {
      from { opacity:0; transform:translateY(-6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes float {
      0%,100% { transform:translateY(0); }
      50%      { transform:translateY(-5px); }
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-dimmer); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">💎</div>
      <span class="logo-name">GemLog</span>
      <span class="logo-badge">NEXT</span>
      <div class="status-dot" id="statusDot"></div>
    </div>
    <div class="header-actions">
      <div class="icon-btn" id="searchToggleBtn" title="Search">🔍</div>
      <div class="icon-btn" id="refreshBtn" data-i18n-title="btnRefreshTitle">↺</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="chats"    data-i18n="tabChats">Chats</div>
    <div class="tab"        data-tab="detail" id="detailTab" style="display:none" data-i18n="tabDetail">Detail</div>
    <div class="tab"        data-tab="settings" data-i18n="tabSettings">Settings</div>
  </div>

  <!-- Panel Container -->
  <div class="panel-container">

    <!-- ===== CHATS PANEL ===== -->
    <div class="panel active" id="panelChats">

      <div class="search-bar" id="searchBar">
        <div class="search-wrap">
          <span class="search-prefix">🔍</span>
          <input class="search-input" id="searchInput" type="text" placeholder="Search chats or tags...">
        </div>
      </div>

      <div class="list-controls">
        <span class="ctrl-label" data-i18n="labelSort">Sort</span>
        <select class="ctrl-select" id="sortSelect">
          <option value="newest"    data-i18n="optSortNewest">Newest</option>
          <option value="oldest"    data-i18n="optSortOldest">Oldest</option>
          <option value="messages"  data-i18n="optSortMessages">Most Messages</option>
          <option value="favorites" data-i18n="optSortFavorites">Favorites First</option>
        </select>
        <span class="ctrl-label" data-i18n="labelFilter">Filter</span>
        <select class="ctrl-select" id="filterSelect">
          <option value="all"       data-i18n="optFilterAll">All</option>
          <option value="favorites" data-i18n="optFilterFavorites">★ Favorites</option>
        </select>
        <div class="spacer"></div>
        <div class="count-badge" id="chatCountBadge">0</div>
      </div>

      <div class="current-chat-bar" id="currentChatBar">
        <div class="ccb-header">
          <span class="ccb-label" data-i18n="currentChatLabel">Current Chat</span>
          <span class="logging-badge stopped" id="loggingBadge">—</span>
        </div>
        <div class="ccb-actions">
          <button class="btn sm" id="toggleLoggingBtn" style="display:none;flex:1;">Record</button>
          <button class="btn sm" id="autoScrollBtn"    style="display:none;flex:1;" data-i18n="btnAutoScroll">⬆ Fetch All History</button>
        </div>
      </div>

      <div id="chatList" class="chat-list"></div>
    </div>

    <!-- ===== DETAIL PANEL ===== -->
    <div class="panel" id="panelDetail">
      <div class="detail-header">
        <div class="icon-btn" id="backBtn">←</div>
        <h2 class="detail-title" id="detailTitle">Chat</h2>
        <button class="fav-btn-large" id="detailFavoriteBtn">☆</button>
      </div>

      <div class="detail-actions">
        <button class="btn sm primary" id="copyMdBtnDetail"   data-i18n="btnCopyMdDetail">📋 Markdown</button>
        <button class="btn sm primary" id="copyJsonBtnDetail" data-i18n="btnCopyJsonDetail">📋 JSON</button>
        <button class="btn sm"         id="summarizeBtn"       data-i18n="btnSummarize">✨ Summarize</button>
        <div class="spacer"></div>
        <button class="btn sm danger"  id="deleteChatBtn">🗑</button>
      </div>

      <div class="summary-card" id="summaryCard">
        <div class="summary-header">
          <span class="summary-label" data-i18n="titleAiSummary">✨ AI Summary</span>
          <button class="btn xs" id="copySummaryBtn" style="display:none;" data-i18n="btnCopy">📋 Copy</button>
        </div>
        <div class="summary-text" id="summaryText"></div>
      </div>

      <div class="message-list" id="messagePreview"></div>
    </div>

    <!-- ===== SETTINGS PANEL ===== -->
    <div class="panel" id="panelSettings">
      <div class="settings-body">

        <div class="s-section">
          <div class="s-section-title" data-i18n="sectionLogSettings">Logging</div>

          <div class="form-group">
            <label class="form-label" data-i18n="labelLoggingMode">Mode</label>
            <select class="form-input" id="loggingMode">
              <option value="all"       data-i18n="optLogAll">All Chats</option>
              <option value="blacklist" data-i18n="optLogBlacklist">Exclude Listed</option>
              <option value="whitelist" data-i18n="optLogWhitelist">Listed Only</option>
            </select>
          </div>

          <div class="form-group" id="listManagementArea" style="display:none;">
            <label class="form-label" id="listManagementLabel">List</label>
            <div class="managed-list" id="managedList">
              <div class="managed-list-empty" data-i18n="msgListEmpty">List is empty</div>
            </div>
          </div>
        </div>

        <div class="s-section">
          <div class="s-section-title" data-i18n="sectionApiSettings">AI Summary API</div>

          <div class="form-group">
            <label class="form-label" data-i18n="labelApiProvider">Provider</label>
            <select class="form-input" id="apiProvider">
              <option value="none"      data-i18n="optApiNone">Disabled</option>
              <option value="google">Google AI Studio (Gemini)</option>
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic (Claude)</option>
              <option value="custom"    data-i18n="optApiCustom">Custom (OpenAI-compatible)</option>
            </select>
          </div>

          <div id="apiFields" style="display:none;">
            <div class="form-group">
              <label class="form-label" data-i18n="labelApiKey">API Key</label>
              <div class="pw-wrap">
                <input type="password" class="form-input mono" id="apiKey" placeholder="sk-... / AIza...">
                <button class="pw-toggle" id="apiKeyToggle" type="button">👁</button>
              </div>
              <span class="form-hint" data-i18n="hintApiKey">Stored locally. Only sent to your configured API.</span>
            </div>

            <div class="form-group">
              <label class="form-label" data-i18n="labelApiModel">Model (blank for default)</label>
              <input type="text" class="form-input mono" id="apiModel" placeholder="gpt-4o-mini / gemini-2.0-flash">
            </div>

            <div class="form-group" id="endpointGroup" style="display:none;">
              <label class="form-label" data-i18n="labelApiEndpoint">Endpoint URL</label>
              <input type="text" class="form-input mono" id="apiEndpoint" placeholder="https://api.example.com/v1/chat/completions">
              <div class="url-status" id="urlStatus"></div>
              <span class="form-error" id="endpointError" data-i18n="errEndpointInvalid">Must be a valid https:// URL</span>
            </div>
          </div>
        </div>

        <div class="s-section">
          <div class="s-section-title" data-i18n="sectionExportSettings">Export</div>
          <div class="form-group">
            <label class="form-label" data-i18n="labelExportFormat">Default Format</label>
            <select class="form-input" id="exportFormat">
              <option value="markdown">Markdown (.md)</option>
              <option value="json">JSON (.json)</option>
              <option value="obsidian">Obsidian Markdown</option>
            </select>
          </div>
        </div>

        <button class="btn primary" id="saveSettingsBtn" style="width:100%;" data-i18n="btnSaveSettings">Save Settings</button>

        <div style="display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--border);">
          <button class="btn danger" id="deleteAllBtn" style="flex:1;" data-i18n="btnDeleteAll">Delete All Logs</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Storage Footer -->
  <div class="storage-footer">
    <div class="storage-info">
      <span data-i18n="storageUsageLabel">Storage</span>
      <span id="storageUsage">0 MB / 100 MB</span>
    </div>
    <div class="storage-track">
      <div class="storage-fill" id="storageBar" style="width:0%"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="lib/storage-manager.js"></script>
  <script type="module" src="popup/main.js"></script>
</body>
</html>
