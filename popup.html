<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GemLog Next</title>
  <style>
    :root {
      --bg:           #080c14;
      --bg-card:      rgba(255,255,255,0.04);
      --bg-card-hover:rgba(255,255,255,0.07);
      --bg-input:     rgba(255,255,255,0.06);
      --accent:       #10b981;
      --accent-dim:   #059669;
      --accent-glow:  rgba(16,185,129,0.18);
      --accent-border:rgba(16,185,129,0.28);
      --text:         #e2e8f0;
      --text-dim:     #64748b;
      --text-dimmer:  #2d3a4a;
      --border:       rgba(255,255,255,0.08);
      --danger:       #ef4444;
      --danger-bg:    rgba(239,68,68,0.12);
      --warning:      #f59e0b;
      --mono:         'SF Mono','Fira Code','Cascadia Code','Consolas',monospace;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width: 100%; height: 100%;
    }
    body {
      min-width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); font-size: 13px;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; position: relative;
    }
    .header::after {
      content:''; position:absolute; bottom:-1px; left:20px; right:20px;
      height:1px; background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:.35;
    }
    .logo { display:flex; align-items:center; gap:8px; }
    .logo-icon {
      width:26px; height:26px;
      background:linear-gradient(135deg,#10b981,#06b6d4);
      border-radius:7px; display:flex; align-items:center; justify-content:center;
      font-size:14px; box-shadow:0 0 14px rgba(16,185,129,.35);
    }
    .logo-name {
      font-size:15px; font-weight:700; letter-spacing:-.3px;
      background:linear-gradient(135deg,#e2e8f0,#94a3b8);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .logo-badge {
      font-size:9px; font-family:var(--mono); color:var(--accent);
      padding:1px 5px; border:1px solid var(--accent-border); border-radius:4px; letter-spacing:.4px;
    }
    .header-actions { display:flex; align-items:center; gap:4px; }

    /* ===== TABS ===== */
    .tabs {
      display:flex; border-bottom:1px solid var(--border);
      padding:0 12px; flex-shrink:0;
    }
    .tab {
      padding:9px 14px; cursor:pointer; color:var(--text-dim);
      font-size:12px; font-weight:500; border-bottom:2px solid transparent;
      transition:color .15s,border-color .15s; user-select:none;
    }
    .tab:hover { color:var(--text); }
    .tab.active { color:var(--accent); border-bottom-color:var(--accent); }

    /* ===== PANELS ===== */
    .panel-container { flex:1; overflow:hidden; position:relative; }
    .panel { position:absolute; inset:0; display:none; flex-direction:column; overflow:hidden; }
    .panel.active { display:flex; }

    /* ===== SECURITY NOTICE ===== */
    .security-notice {
      display:flex; align-items:center; gap:8px;
      margin:10px 14px 0;
      padding:9px 12px;
      background:rgba(16,185,129,.05);
      border:1px solid rgba(16,185,129,.18);
      border-radius:9px;
      font-size:11px; color:var(--text-dim);
      flex-shrink:0;
    }
    .security-notice .icon { font-size:14px; flex-shrink:0; }
    .security-notice strong { color:var(--accent); }

    /* ===== VIEW PANES ===== */
    .view-pane { flex:1; display:flex; flex-direction:column; overflow:hidden; }

    /* 現在のチャット */
    .current-card-wrap { flex:1; overflow-y:auto; padding:14px; }
    .current-card {
      padding:16px 14px; background:var(--bg-card); border:1px solid var(--accent-border);
      border-radius:12px; display:flex; flex-direction:column; gap:10px;
    }
    .card-title { font-size:15px; font-weight:600; line-height:1.4; }
    .card-meta  { display:flex; gap:8px; align-items:center; font-size:11px; color:var(--text-dim); font-family:var(--mono); }
    .card-notice { font-size:11px; color:var(--text-dim); padding:8px 10px; background:rgba(255,255,255,.03); border-radius:7px; }

    /* 選択モードのトップバー */
    .select-topbar {
      display:flex; align-items:center; gap:8px;
      padding:8px 14px; border-bottom:1px solid var(--border); flex-shrink:0;
    }
    .select-topbar-label { font-size:11px; color:var(--text-dim); }

    /* 両モード共通の下部バー */
    .pane-bar {
      display:flex; align-items:center; gap:7px;
      padding:10px 14px; border-top:1px solid var(--border); flex-shrink:0;
      position:relative; z-index:1001;
    }
    .select-all-wrap {
      display:flex; align-items:center; gap:6px;
      cursor:pointer; font-size:11px; color:var(--text-dim); user-select:none;
    }
    .select-all-wrap input[type=checkbox] { accent-color:var(--accent); width:14px; height:14px; cursor:pointer; }
    .fmt-select {
      background:var(--bg-input); border:1px solid var(--border);
      border-radius:6px; color:var(--text); font-size:11px;
      padding:4px 8px; outline:none; cursor:pointer;
    }
    .fmt-select:focus { border-color:var(--accent); }

    /* ===== SESSION LIST ===== */
    .session-list {
      flex:1; overflow-y:auto;
      padding:10px 14px; display:flex; flex-direction:column; gap:7px;
    }

    .session-item {
      display:flex; align-items:center; gap:10px;
      padding:11px 12px;
      background:var(--bg-card); border:1px solid var(--border); border-radius:10px;
      cursor:pointer; transition:background .16s, border-color .16s, transform .16s;
      animation:fadeSlideIn .22s ease both;
    }
    .session-item:hover { background:var(--bg-card-hover); border-color:rgba(255,255,255,.13); transform:translateY(-1px); }
    .session-item.selected { border-color:var(--accent-border); background:rgba(16,185,129,.05); }

    .session-checkbox {
      accent-color:var(--accent); width:16px; height:16px;
      cursor:pointer; flex-shrink:0;
    }

    .session-info { flex:1; min-width:0; }
    .session-title {
      font-weight:600; font-size:13px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      margin-bottom:4px;
    }
    .session-meta {
      display:flex; gap:8px; align-items:center;
      font-size:10px; color:var(--text-dim); font-family:var(--mono);
    }
    .session-meta .dot { color:var(--text-dimmer); }
    .msg-badge {
      display:inline-flex; align-items:center; gap:3px;
      font-size:10px; font-family:var(--mono); color:var(--accent);
      padding:1px 6px; border:1px solid var(--accent-border);
      border-radius:10px; background:var(--accent-glow);
    }

    .session-actions { display:flex; gap:4px; flex-shrink:0; }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:40px 20px; color:var(--text-dim); text-align:center; gap:10px;
    }
    .empty-icon { font-size:40px; opacity:.4; animation:float 3s ease-in-out infinite; }
    .empty-title { font-size:14px; font-weight:600; color:var(--text); }
    .empty-sub { font-size:11px; max-width:240px; line-height:1.6; }
    .empty-hint {
      margin-top:4px; font-size:11px; color:var(--accent);
      padding:6px 12px; border:1px solid var(--accent-border);
      border-radius:8px; background:var(--accent-glow);
    }

    /* ===== SETTINGS ===== */
    .settings-body { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:18px; }
    .s-section { display:flex; flex-direction:column; gap:10px; }
    .s-title {
      font-size:10px; font-family:var(--mono); color:var(--text-dim);
      text-transform:uppercase; letter-spacing:1px;
      padding-bottom:6px; border-bottom:1px solid var(--border);
    }
    .form-group { display:flex; flex-direction:column; gap:5px; }
    .form-label { font-size:11px; font-weight:500; color:var(--text-dim); }
    .form-input {
      width:100%; padding:8px 10px;
      background:var(--bg-input); border:1px solid var(--border);
      border-radius:8px; color:var(--text); font-size:12px; outline:none; font-family:inherit;
      transition:border-color .15s, box-shadow .15s;
    }
    .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
    .form-input.mono { font-family:var(--mono); font-size:11px; }
    .form-input.error { border-color:var(--danger); }
    .form-hint { font-size:10px; color:var(--text-dim); line-height:1.4; }
    .form-error { font-size:10px; color:var(--danger); display:none; }
    .form-error.visible { display:block; }
    .pw-wrap { position:relative; }
    .pw-wrap .form-input { padding-right:36px; }
    .pw-toggle {
      position:absolute; right:9px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer; color:var(--text-dim); font-size:14px;
      transition:color .15s;
    }
    .pw-toggle:hover { color:var(--text); }
    .url-status { display:flex; align-items:center; gap:4px; font-size:10px; margin-top:3px; }
    .url-status.valid { color:var(--accent); }
    .url-status.invalid { color:var(--danger); }
    #apiFields { display:flex; flex-direction:column; gap:10px; }

    /* ===== BUTTONS ===== */
    .btn {
      padding:6px 12px; border:1px solid var(--border); border-radius:7px;
      background:var(--bg-input); color:var(--text); cursor:pointer;
      font-size:11px; font-family:inherit; white-space:nowrap;
      display:inline-flex; align-items:center; gap:5px;
      transition:background .14s, border-color .14s;
    }
    .btn:hover { background:var(--bg-card-hover); border-color:rgba(255,255,255,.14); }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }
    .btn.primary:hover { background:var(--accent-dim); border-color:var(--accent-dim); }
    .btn.primary:disabled { background:var(--text-dimmer); border-color:var(--text-dimmer); color:var(--text-dim); cursor:default; }
    .btn.danger { border-color:rgba(239,68,68,.3); color:var(--danger); }
    .btn.danger:hover { background:var(--danger-bg); border-color:var(--danger); }
    .btn.sm { padding:4px 9px; font-size:10px; border-radius:6px; }
    .btn.xs { padding:2px 7px; font-size:10px; border-radius:5px; }
    .icon-btn {
      width:30px; height:30px; display:flex; align-items:center; justify-content:center;
      border:1px solid var(--border); border-radius:8px;
      background:var(--bg-input); color:var(--text-dim); cursor:pointer; font-size:14px;
      transition:background .14s, color .14s, border-color .14s;
    }
    .icon-btn:hover { background:var(--bg-card-hover); color:var(--text); border-color:rgba(255,255,255,.14); }

    /* ===== STORAGE FOOTER ===== */
    .storage-footer {
      padding:7px 14px; border-top:1px solid var(--border); flex-shrink:0;
    }
    .storage-info {
      display:flex; justify-content:space-between;
      font-size:10px; font-family:var(--mono); color:var(--text-dim); margin-bottom:4px;
    }
    .storage-track { height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
    .storage-fill { height:100%; background:linear-gradient(90deg,var(--accent),#06b6d4); border-radius:2px; transition:width .4s; }

    /* ===== TOAST ===== */
    .toast {
      position:fixed; top:48px; left:50%;
      transform:translateX(-50%) translateY(-14px);
      padding:8px 16px;
      background:rgba(15,23,42,.96); border:1px solid var(--accent-border);
      border-radius:8px; font-size:12px; color:var(--text);
      opacity:0; z-index:1000; backdrop-filter:blur(10px);
      transition:transform .22s ease, opacity .22s ease;
      white-space:nowrap; pointer-events:none;
    }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeSlideIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-dimmer); border-radius:2px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--text-dim); }

    /* managed list */
    .managed-list { max-height:120px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; background:var(--bg-input); }
    .ml-item { display:flex; align-items:center; justify-content:space-between; padding:7px 10px; border-bottom:1px solid var(--border); font-size:11px; }
    .ml-item:last-child { border-bottom:none; }
    .ml-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:8px; }
    .ml-empty { padding:14px; text-align:center; color:var(--text-dim); font-size:11px; }

    /* サイドバー会話リスト用 */
    .loading-msg {
      display:flex; align-items:center; justify-content:center;
      padding:40px 20px; color:var(--text-dim); font-size:13px;
    }
    .current-badge {
      font-size:10px; color:var(--accent);
      padding:1px 6px; border:1px solid var(--accent-border);
      border-radius:10px; background:var(--accent-glow);
    }
    .session-item.is-current { border-color:var(--accent-border) !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">💎</div>
      <span class="logo-name">GemLog</span>
      <span class="logo-badge">NEXT</span>
    </div>
    <div class="header-actions">
      <div class="icon-btn" id="refreshBtn" title="Refresh">↺</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="sessions" data-i18n="tabSessions">Sessions</div>
    <div class="tab"        data-tab="settings" data-i18n="tabSettings">Settings</div>
  </div>

  <!-- Panels -->
  <div class="panel-container">

    <!-- ===== SESSIONS PANEL ===== -->
    <div class="panel active" id="panelSessions">

      <!-- セキュリティ通知 -->
      <div class="security-notice">
        <span class="icon">🔒</span>
        <span data-i18n="sessionNotice">履歴はセッション限定です。別ページに移動またはタブを閉じると自動削除されます。</span>
      </div>

      <!-- 現在のチャット（デフォルト）-->
      <div id="currentView" class="view-pane">
        <div id="currentCardWrap" class="current-card-wrap"></div>
        <div class="pane-bar">
          <button class="btn sm" id="selectModeBtn">☰ 選択ダウンロード</button>
          <div style="flex:1"></div>
          <select class="fmt-select" id="downloadFormat">
            <option value="markdown">Markdown</option>
            <option value="json">JSON</option>
            <option value="obsidian">Obsidian</option>
          </select>
          <button class="btn danger sm" id="currentCancelBtn" style="display:none">✕ 中止</button>
          <button class="btn primary" id="currentDownloadBtn">⬇ ダウンロード</button>
        </div>
      </div>

      <!-- 選択ダウンロード（セカンダリ）-->
      <div id="selectView" class="view-pane" style="display:none">
        <div class="select-topbar">
          <button class="btn sm" id="backBtn">← 戻る</button>
          <span class="select-topbar-label">Gemini サイドバーの会話</span>
        </div>
        <div id="sessionList" class="session-list"></div>
        <div class="pane-bar">
          <label class="select-all-wrap">
            <input type="checkbox" id="selectAllChk">
            <span data-i18n="selectAll">すべて選択</span>
          </label>
          <div style="flex:1"></div>
          <button class="btn danger sm" id="bulkCancelBtn" style="display:none">✕ 中止</button>
          <select class="fmt-select" id="downloadFormatBulk">
            <option value="markdown">Markdown</option>
            <option value="json">JSON</option>
            <option value="obsidian">Obsidian</option>
          </select>
          <button class="btn primary" id="downloadBtn" disabled>⬇ ダウンロード (0)</button>
        </div>
      </div>

    </div>

    <!-- ===== SETTINGS PANEL ===== -->
    <div class="panel" id="panelSettings">
      <div class="settings-body">

        <div class="s-section">
          <div class="s-title" data-i18n="sectionApiSettings">AI Summary API</div>

          <div class="form-group">
            <label class="form-label" data-i18n="labelApiProvider">Provider</label>
            <select class="form-input" id="apiProvider">
              <option value="none"      data-i18n="optApiNone">Disabled</option>
              <option value="google">Google AI Studio (Gemini)</option>
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic (Claude)</option>
              <option value="custom"    data-i18n="optApiCustom">Custom (OpenAI-compatible)</option>
            </select>
          </div>

          <div id="apiFields" style="display:none;">
            <div class="form-group">
              <label class="form-label" data-i18n="labelApiKey">API Key</label>
              <div class="pw-wrap">
                <input type="password" class="form-input mono" id="apiKey" placeholder="sk-... / AIza...">
                <button class="pw-toggle" id="apiKeyToggle" type="button">👁</button>
              </div>
              <span class="form-hint" data-i18n="hintApiKey">Stored locally. Only sent to your configured API.</span>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="labelApiModel">Model (blank for default)</label>
              <input type="text" class="form-input mono" id="apiModel" placeholder="gpt-4o-mini / gemini-2.0-flash">
            </div>
            <div class="form-group" id="endpointGroup" style="display:none;">
              <label class="form-label" data-i18n="labelApiEndpoint">Endpoint URL</label>
              <input type="text" class="form-input mono" id="apiEndpoint" placeholder="https://api.example.com/v1/chat/completions">
              <div class="url-status" id="urlStatus"></div>
              <span class="form-error" id="endpointError" data-i18n="errEndpointInvalid">Must be a valid https:// URL</span>
            </div>
          </div>
        </div>

        <div class="s-section">
          <div class="s-title" data-i18n="sectionExportSettings">Export</div>
          <div class="form-group">
            <label class="form-label" data-i18n="labelExportFormat">Default Format</label>
            <select class="form-input" id="exportFormat">
              <option value="markdown">Markdown (.md)</option>
              <option value="json">JSON (.json)</option>
              <option value="obsidian">Obsidian Markdown</option>
            </select>
          </div>
        </div>

        <button class="btn primary" id="saveSettingsBtn" style="width:100%;" data-i18n="btnSaveSettings">Save Settings</button>
      </div>
    </div>

  </div>

  <!-- Storage Footer -->
  <div class="storage-footer">
    <div class="storage-info">
      <span data-i18n="storageUsageLabel">Session Storage</span>
      <span id="storageUsage">0 KB</span>
    </div>
    <div class="storage-track">
      <div class="storage-fill" id="storageBar" style="width:0%"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="lib/storage-manager.js"></script>
  <script type="module" src="popup/main.js"></script>
</body>
</html>
